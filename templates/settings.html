{% extends 'base.html' %}
{% block title %}Settings{% endblock %}
{% block eyebrow %}Settings{% endblock %}
{% block content %}
<section class="page-section">
    <div class="section-heading">
        <div>
            <span class="eyebrow">System controls</span>
            <h1>Settings</h1>
            <p class="muted">Tune recognition and workspace behavior.</p>
        </div>
    </div>
    <form method="post" class="panel form-card">
        <div class="form-grid">
            <div class="field">
                <label>Face match threshold
                    <input type="number" name="face_match_threshold" min="0.30" max="0.75" step="0.01" value="{{ settings['face_match_threshold'] }}" required>
                </label>
            </div>
            <div class="field">
                <label>Camera scan interval (ms)
                    <input type="number" name="camera_scan_interval_ms" min="250" max="10000" step="50" value="{{ settings['camera_scan_interval_ms'] }}" required>
                </label>
            </div>
            <div class="field">
                <label>Recognition cooldown (seconds)
                    <input type="number" name="recognition_cooldown_seconds" min="5" max="300" step="1" value="{{ settings['recognition_cooldown_seconds'] }}" required>
                </label>
            </div>
            <div class="field">
                <label>Application name
                    <input name="application_name" maxlength="80" value="{{ settings['application_name'] }}" required>
                </label>
            </div>
        </div>
        <div class="form-actions">
            <button class="primary-button" type="submit">Save settings <span>→</span></button>
        </div>
    </form>
</section>
{% endblock %}
